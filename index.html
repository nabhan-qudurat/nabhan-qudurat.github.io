<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبارات نبهان</title>
<meta name="description" content="منصة اختبارات مستر نبهان المحاكية لاختبار القدرات العامة - القسم اللفظي">
<meta name="theme-color" content="#071634">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اختبارات نبهان">
<style>
:root{--bg:#071634;--gold:#e3b84f;--fg:#eef2fb}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);z-index:5;transition:opacity .4s}
#splash img{width:120px;height:120px;border-radius:50%}
#splash b{color:var(--gold);font-size:20px}
.dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--gold);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.2}50%{opacity:1}}
#off{display:none;position:fixed;inset:0;z-index:6;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;text-align:center}
#off button,#inst button{font:inherit;font-weight:700;background:var(--gold);color:#071634;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
#inst{display:none;position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:7;background:#0b2350;border:1px solid var(--gold);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:14px;line-height:1.7}
#inst .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
#inst .x{background:transparent;color:var(--fg);border:1px solid #445;padding:6px 10px}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><b>اختبارات نبهان</b><div class="dots"><span></span><span></span><span></span></div></div>
<div id="off"><img src="icon-192.png" alt="" width="90" height="90" style="border-radius:50%"><b style="color:var(--gold)">لا يوجد اتصال بالإنترنت</b><div>المنصة تحتاج إلى الإنترنت. تأكد من الاتصال ثم اضغط إعادة المحاولة.</div><button onclick="location.reload()">إعادة المحاولة</button></div>
<iframe id="app" title="اختبارات نبهان" allow="autoplay; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="inst"><div class="row"><div id="instTxt"></div><div style="display:flex;gap:6px"><button id="instBtn">تثبيت</button><button class="x" id="instX">لاحقًا</button></div></div></div>
<script>
var URL_APP='https://script.google.com/macros/s/AKfycbxkxvJzET4HcWWsOQOcwGhQSQozt7u2WeXyGDFwFJqSgzhSlMouJNszBD1jkAg5lrKT/exec';
var f=document.getElementById('app'),sp=document.getElementById('splash');
if(!navigator.onLine){document.getElementById('off').style.display='flex'}
f.onload=function(){sp.style.opacity='0';setTimeout(function(){sp.style.display='none'},400)};
f.src=URL_APP;
setTimeout(function(){sp.style.opacity='0';setTimeout(function(){sp.style.display='none'},400)},12000);
window.addEventListener('offline',function(){document.getElementById('off').style.display='flex'});
window.addEventListener('online',function(){location.reload()});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
/* دعوة التثبيت */
var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function seen(){try{return localStorage.getItem('nb_inst_x')}catch(e){return null}}
function hide(){try{localStorage.setItem('nb_inst_x',Date.now())}catch(e){}document.getElementById('inst').style.display='none'}
document.getElementById('instX').onclick=hide;
var dp=null,ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;if(standalone||seen())return;
  document.getElementById('instTxt').textContent='ثبّت تطبيق «اختبارات نبهان» على جهازك ليفتح بضغطة واحدة.';
  document.getElementById('inst').style.display='block'});
document.getElementById('instBtn').onclick=function(){if(dp){dp.prompt();dp.userChoice.finally(function(){hide()})}else hide()};
if(ios&&!standalone&&!seen()){setTimeout(function(){
  document.getElementById('instTxt').innerHTML='لتثبيت التطبيق على الآيفون/الآيباد: اضغط زر المشاركة <b>⬆︎</b> في سفاري ثم <b>«إضافة إلى الشاشة الرئيسية»</b>.';
  document.getElementById('instBtn').style.display='none';document.getElementById('inst').style.display='block'},4000)}
</script>
</body>
</html>
